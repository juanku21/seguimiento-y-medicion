# Servicio PostgreSQL compartido por los entornos de desarrollo y de test. Cada entorno se levanta
# con su propio archivo de variables y nombre de proyecto, lo que da contenedores, volúmenes y
# puertos disjuntos:
#   docker compose --env-file .env -p smye-dev up -d
#   docker compose --env-file .env.test -p smye-test up -d
services:
  # Base de datos con versión fija; credenciales, nombre de la base y puerto del host salen del
  # archivo de entorno y el arranque falla si falta alguna variable. Desde PostgreSQL 18 la imagen
  # guarda los datos en un subdirectorio por versión, por eso el volumen se monta en
  # /var/lib/postgresql y no en /var/lib/postgresql/data.
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:?falta POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

# Volumen nombrado para persistir los datos; Compose le antepone el nombre de proyecto.
volumes:
  postgres_data:
